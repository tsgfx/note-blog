name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 切片与单元测试不需要外部依赖；上下文烟雾测试用 Testcontainers 自建 MySQL。
      # GitHub 的 runner 自带 Docker，所以这里显式打开（本地默认跳过，见测试类注释）。
      - run: mvn -B -ntp verify
        env:
          SMOKE_TESTCONTAINERS: '1'
      # 冒烟测试那一步直接跑这个 jar：再开一次 mvn package 等于把编译与依赖解析
      # 重做一遍，而两边的输入完全一样
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  frontend:
    name: 前端 lint 与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  # 冒烟测试跑真栈：MySQL + 后端 jar + 真实 nginx.conf + 构建产物。
  # 不配 webServer 是刻意的（见 frontend/playwright.config.ts）——要抓的正是
  # 「页面能打开、接口全挂」这类问题，vite preview 一个没有反代的空壳抓不到。
  e2e:
    name: 前端冒烟（真栈）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    env:
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: e2e-only-not-a-real-password
      E2E_BASE_URL: http://localhost:8088
      DB_PASSWORD: e2e_db_password
      JWT_SECRET: e2e-only-jwt-secret-do-not-use-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 表结构由 db/schema.sql 显式管理（应用不建表），这里让它当 mysql 的初始化脚本。
      # 端口映射到 3307，避开 runner 宿主机可能预装的默认 3306 端口冲突。
      - name: 起 MySQL
        run: |
          docker run -d --name e2e-mysql -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=notes_blog \
            -e MYSQL_USER=notes \
            -e "MYSQL_PASSWORD=${DB_PASSWORD}" \
            -v "${PWD}/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" \
            mysql:9
          for _ in $(seq 60); do
            docker exec e2e-mysql mysql -uroot -proot -e 'select 1 from notes_blog.notes limit 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::MySQL 60 秒内没建好表"
          docker logs e2e-mysql --tail 50
          exit 1

      # 嵌入服务指向一个必然连不上的端口：冒烟不需要语义检索，
      # 顺便验证「依赖不可用只降级、不影响浏览与编辑」。健康检查要接受 degraded。
      - name: 起后端
        run: |
          nohup java -jar backend/target/notes-blog-backend-*.jar > backend.log 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::后端 120 秒内没起来"
          tail -100 backend.log
          exit 1
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: notes_blog
          DB_USER: notes
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          SITE_BASE_URL: http://localhost:8088
          CORS_ALLOWED_ORIGINS: http://localhost:8088
          EMBEDDING_BASE_URL: http://127.0.0.1:9
          LLM_API_KEY: ''

      # backend 是 host 上的进程，容器里要用 host-gateway 才连得到；
      # 挂的是仓库里的 nginx.conf 与刚构建的 dist，和线上是同一份配置
      - name: 构建前端并起 nginx
        working-directory: frontend
        run: |
          npm ci
          npm run build
          docker run -d --name e2e-nginx -p 8088:80 \
            --add-host backend:host-gateway \
            -v "${PWD}/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${PWD}/dist:/usr/share/nginx/html:ro" \
            nginx:1.27-alpine
          for _ in $(seq 30); do
            curl -fsS http://localhost:8088/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::nginx 没起来"
          docker logs e2e-nginx --tail 50
          exit 1

      # 空库时「列表有行、正文渲染」这些用例不是失败而是没东西可点，等于白跑
      - name: 种入测试数据
        run: sh scripts/e2e-seed.sh

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: 装浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 跑冒烟
        working-directory: frontend
        run: npm run e2e

      - name: 失败时留下现场
        if: failure()
        run: |
          echo "── 后端日志 ──"; tail -200 backend.log || true
          echo "── nginx ──"; docker logs e2e-nginx --tail 100 || true
          echo "── mysql ──"; docker logs e2e-mysql --tail 50 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: frontend/test-results
          if-no-files-found: ignore

  scripts:
    name: 部署脚本静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 这两条都对应真踩过的坑，不是凑数的检查项：
      #   1) sh -n 抓语法错误（部署脚本一次跑几分钟，语法错要到线上才发现太贵）
      #   2) dash 会把变量后紧跟的中文标点字节当成变量名的一部分，
      #      `$NAME（` 直接 "unbound variable" 退出 —— 必须写 ${NAME}（
      - name: sh 语法
        run: |
          for f in scripts/*.sh deploy/*.sh deploy/*/*.sh; do
            [ -f "$f" ] || continue
            sh -n "$f" || { echo "::error file=$f::sh 语法错误"; exit 1; }
          done
          echo "全部脚本语法通过"
      - name: 变量后不得紧跟非 ASCII
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for path in glob.glob('scripts/*.sh') + glob.glob('deploy/**/*.sh', recursive=True):
              for lineno, line in enumerate(open(path, encoding='utf-8'), 1):
                  # 变量引用后紧跟非 ASCII（中文标点/汉字）→ dash 会把它吃进变量名
                  for _ in re.finditer(r'\$[A-Za-z_][A-Za-z0-9_]*(?=[^\x00-\x7f])', line):
                      bad.append(f'{path}:{lineno}: {line.strip()}')
          if bad:
              print('\n'.join(bad))
              print('\n变量后紧跟中文标点/汉字时，dash 会把它吃进变量名；请写成 ${VAR} 形式')
              sys.exit(1)
          print('未发现变量与中文标点相邻的写法')
          PY
