name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 切片与单元测试不需要外部依赖；上下文烟雾测试用 Testcontainers 自建 MySQL。
      # GitHub 的 runner 自带 Docker，所以这里显式打开（本地默认跳过，见测试类注释）。
      - run: mvn -B -ntp verify
        env:
          SMOKE_TESTCONTAINERS: '1'

  frontend:
    name: 前端 lint 与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  scripts:
    name: 部署脚本静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 这两条都对应真踩过的坑，不是凑数的检查项：
      #   1) sh -n 抓语法错误（部署脚本一次跑几分钟，语法错要到线上才发现太贵）
      #   2) dash 会把变量后紧跟的中文标点字节当成变量名的一部分，
      #      `$NAME（` 直接 "unbound variable" 退出 —— 必须写 ${NAME}（
      - name: sh 语法
        run: |
          for f in scripts/*.sh deploy/*.sh deploy/*/*.sh; do
            [ -f "$f" ] || continue
            sh -n "$f" || { echo "::error file=$f::sh 语法错误"; exit 1; }
          done
          echo "全部脚本语法通过"
      - name: 变量后不得紧跟非 ASCII
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for path in glob.glob('scripts/*.sh') + glob.glob('deploy/**/*.sh', recursive=True):
              for lineno, line in enumerate(open(path, encoding='utf-8'), 1):
                  # 变量引用后紧跟非 ASCII（中文标点/汉字）→ dash 会把它吃进变量名
                  for _ in re.finditer(r'\$[A-Za-z_][A-Za-z0-9_]*(?=[^\x00-\x7f])', line):
                      bad.append(f'{path}:{lineno}: {line.strip()}')
          if bad:
              print('\n'.join(bad))
              print('\n变量后紧跟中文标点/汉字时，dash 会把它吃进变量名；请写成 ${VAR} 形式')
              sys.exit(1)
          print('未发现变量与中文标点相邻的写法')
          PY
