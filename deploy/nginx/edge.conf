# 生产边缘规则（本地文件即规则源）
#
# 这个文件挂载覆盖 frontend 镜像里的 /etc/nginx/conf.d/default.conf。
# 改完生效：docker compose -f docker-compose.prod.yml restart frontend
# 校验语法：docker compose -f docker-compose.prod.yml exec frontend nginx -t
#
# 分层说明（谁负责什么，别重复叠加）：
#   Caddy      —— TLS、HSTS 等安全头、隐藏 Server
#   ufw        —— 网络层只开 22/80/443（见 deploy/rules/firewall.sh）
#   edge.conf  —— 应用层：限流、黑名单、敏感路径、真实 IP
#   Spring     —— 业务限流 RateLimitInterceptor（问答/搜索按接口计数）
#
# 尾部带 [改这里] 的段落是日常最常调的地方。

# ── 真实客户端 IP ──────────────────────────────────────────
# 只有内网 172.28.0.0/24（Caddy 所在网段）送来的 X-Forwarded-For 才被采信。
# 不信任外部 XFF：否则攻击者随手伪造一个 IP 就能绕过按 IP 的限流。
# 后端 ClientIp 只认 X-Real-IP（见 common/ClientIp.java），所以下面所有
# proxy_set_header X-Real-IP $remote_addr 里的 $remote_addr 必须是真实客户端。
set_real_ip_from 172.28.0.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── 限流水位 [改这里] ──────────────────────────────────────
# api：普通接口，前端一次进页面会并发十几个 XHR，20r/s 留足余量
# ask：问答要花 LLM token，收紧到 10 次/分钟（与后端 RATE_LIMIT_ASK 默认值一致）
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80 default_server;
    server_name _;

    # 隐藏版本号，避免按版本挑漏洞
    server_tokens off;

    # 图片上传后端限制 10MB，这里留余量
    client_max_body_size 12m;

    # 只接受这几种方法，其余一律 405（TRACE/TRACK 之类直接死在这里）
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # 扫站工具的 UA 直接掐断连接（444 不回任何内容，比 403 更省事）
    # 只挡最常见的自动化工具，正常浏览器/curl 不受影响
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|dirbuster|gobuster|wpscan|acunetix|zgrab|nuclei)) {
        return 444;
    }

    # ── 敏感路径：一律当作不存在 ──────────────────────────
    # 这是台 Java + nginx 的站，任何 WP/PHP/actuator 探测都是扫描器
    location ~* ^/(actuator|server-status|phpmyadmin|wp-admin|wp-login\.php|xmlrpc\.php) {
        return 404;
    }

    # .git / .env / .svn 之类隐藏文件（放过 ACME 的 /.well-known）
    location ~ /\.(?!well-known) {
        return 404;
    }

    # ── 健康检查：不计数 ──────────────────────────────────
    # 部署脚本和监控会高频敲它，计入限流会误伤，也会挤占正常配额
    location = /api/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── 图片等静态资源：不计数 ────────────────────────────
    # 笔记里图片多，一页几十张图如果计入 /api/ 的限流，正常浏览就会 429
    location /api/assets/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ── 问答（SSE 流式）：单独限额 + 关缓冲 ────────────────
    location = /api/ask {
        limit_req zone=ask burst=2 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 10;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 不关缓冲，前端会等到整段回答生成完才看到第一个字
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # ── 其余接口 ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # ── RSS 订阅器惯常探测的路径 ──────────────────────────
    # 不转发的话会被下面的 SPA fallback 吃掉返回 HTML，订阅器拿到假 200 直接失败。
    # 真源在后端 /api/blog/rss.xml，这里做纯别名。
    location = /rss.xml {
        proxy_pass http://backend:8080/api/blog/rss.xml;
        proxy_set_header Host $host;
    }

    location = /feed.xml {
        proxy_pass http://backend:8080/api/blog/rss.xml;
        proxy_set_header Host $host;
    }

    location = /atom.xml {
        proxy_pass http://backend:8080/api/blog/rss.xml;
        proxy_set_header Host $host;
    }

    # ── 爬虫入口 ──────────────────────────────────────────
    # 同 RSS 的道理：这两个文件要写站点的绝对地址，所以由后端按 site.base-url 生成。
    # 不做别名的话 /sitemap.xml 会被下面的 SPA fallback 兜底成 index.html，
    # 爬虫拿到 200 + HTML，会认定这个站没有 sitemap；404 都比假 200 好。
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/blog/sitemap.xml;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://backend:8080/api/blog/robots.txt;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 前端静态产物 ──────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # history 路由：刷新子路径要回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 决定加载哪个 hash 的 JS，必须每次回源校验，
    # 否则会出现「镜像重建了、页面还是旧的」
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带 hash 的静态资源：文件名里有内容 hash，可以缓存一年 + immutable，
    # 回访用户不再为 JS/CSS 花一个字节的流量
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
