# SSH 加固（由 deploy/apply.sh 安装到 /etc/ssh/sshd_config.d/99-note-blog.conf）
#
# 顺序很重要：先确认能用密钥登录，再启用「禁用密码」。
# 否则 apply.sh 一执行，你自己就被锁在门外了。
# apply.sh 会在 reload 前用 `sshd -t` 校验语法，但校验不了「你有没有配好密钥」。

# 禁止密码登录：公网 22 端口每天被爆破几千次，密码登录就是赌运气
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes

# 只接受公钥
PubkeyAuthentication yes
AuthenticationMethods publickey

# root 只能用密钥（不建议直接禁掉，很多云镜像救援要靠它）
PermitRootLogin prohibit-password

# 降低爆破窗口：失败 3 次断开，缩短握手等待
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20

# 空闲 10 分钟自动断开
ClientAliveInterval 300
ClientAliveCountMax 2

# 关掉所有转发通道。额度代采功能已移除，不再需要 ssh -R 反代隧道；
# 之前为它开过 remote，现在收紧回 no。
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no

# 只允许自己的账号登录；照着改成你的用户名后取消注释
# AllowUsers yourname

# 日志级别：排查爆破时有用，fail2ban 也依赖 auth.log
LogLevel VERBOSE
