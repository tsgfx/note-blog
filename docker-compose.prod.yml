# 云服务器生产编排（与开发用的 docker-compose.yml 分开维护）
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f backend
#
# 与开发版的差异（都是有意的）：
#   1. 只有 Caddy 暴露 80/443，mysql/backend/frontend 一律不 publish 到宿主机
#      —— 少了 8081 调试口和 8088 明文口，外面扫不到任何内部服务
#   2. TLS 由 Caddy 自动签发续期，frontend 容器里的 nginx 只当内网静态服务器
#   3. embedding 走硅基流动（EMBEDDING_BACKEND=openai），无 ollama 服务——2C2G 带
#      不动本地模型，服务器也不该为 1GB 镜像花流量
#   4. 加资源与日志上限：个人服务器最容易的死法是日志把盘写满
#   5. 内网固定 172.28.0.0/24：edge nginx 的 realip 只信这个网段，
#      否则任何人都能伪造 X-Forwarded-For 绕过按 IP 的限流
#
# 注意：项目名和开发版同为 note-blog，同一台机器上别同时跑两套（容器名会打架）。

name: note-blog

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产环境必须在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-notes_blog}
      MYSQL_USER: ${DB_USER:-notes}
      MYSQL_PASSWORD: ${DB_PASSWORD:?生产环境必须在 .env 里设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 2G 小机器上 InnoDB 别按默认值吃内存，压到 256M 给 JVM 留空间
      - --innodb-buffer-pool-size=256M
      - --max-connections=80
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    logging: *logging
    networks: [nb]

  backend:
    build: ./backend
    restart: unless-stopped
    <<: *hardening
    # 堆 448M + metaspace 192M + 线程栈/直接内存，RSS 落在 550~650M；
    # 800M 上限留出峰值余量，超了让内核 OOM 杀掉再重启，比拖垮整机好
    mem_limit: 800m
    memswap_limit: 1g
    # 后端不需要任何 Linux capability，也不写容器层
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    dns:
      - 223.5.5.5
      - 119.29.29.29
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      # 容器默认 UTC，而 LocalDateTime 落库/序列化不带时区，前端会按本地时间解析——
      # 不设这个，快照时间会「慢 8 小时」，看板上全显示成 8 小时前的旧数据
      TZ: Asia/Shanghai
      # 堆显式封顶：2C2G 的机器上，JVM 默认按物理内存的 1/4 算（约 440MB），
      # 但堆之外还有 metaspace、线程栈、direct buffer，RSS 会比堆大 150MB 左右。
      # 不写死就会出现「堆没满、机器已经靠 swap 撑着」——swap 一上，检索和问答全变卡。
      # ExitOnOutOfMemoryError：真 OOM 时立刻退出让 restart 拉起，而不是半死不活地拖。
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=Asia/Shanghai
        -Xmx448m -XX:MaxMetaspaceSize=192m
        -XX:+ExitOnOutOfMemoryError
      DB_NAME: ${DB_NAME:-notes_blog}
      DB_USER: ${DB_USER:-notes}
      DB_PASSWORD: ${DB_PASSWORD}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_MODEL: ${LLM_MODEL:-minimax-m3}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?生产环境必须在 .env 里设置 JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?生产环境必须在 .env 里设置 ADMIN_PASSWORD}
      # RSS 链接前缀，必须是带 https 的真实域名
      SITE_BASE_URL: ${SITE_BASE_URL:?生产环境必须在 .env 里设置 SITE_BASE_URL（https://域名）}
      SITE_TITLE: ${SITE_TITLE:-一隅}
      # 部署版本（短 commit），由服务器上的 deploy/pull-deploy.sh 写进 .env；/api/health 会回显
      APP_VERSION: ${APP_VERSION:-dev}
      # 生产务必精确列域名，不要 http://localhost:[*] 这类开发默认值
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?生产环境必须在 .env 里设置 CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_ASK: ${RATE_LIMIT_ASK:-10}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-60}
      ASSETS_ROOT: /data/assets
    volumes:
      - ./storage/assets:/data/assets
      - ./backups:/data/backups:ro
    expose:
      - "8080"
    logging: *logging
    networks: [nb]

  frontend:
    build: ./frontend
    restart: unless-stopped
    <<: *hardening
    depends_on:
      - backend
    volumes:
      # 边缘规则挂载覆盖镜像里的 default.conf：
      # 改限流/黑名单后只需 restart frontend，不用 rebuild（静态文件仍然打在镜像里）
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    logging: *logging
    networks: [nb]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *hardening
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?生产环境必须在 .env 里设置 DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?生产环境必须在 .env 里设置 ACME_EMAIL（证书到期通知邮箱）}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging
    networks: [nb]

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  nb:
    # 名字跟着项目名走：曾经写死成 note-blog-internal，结果同机上起第二套栈时，
    # 两套容器接进同一个网络，DNS 别名 backend / frontend 会同时解析到两边的容器——
    # 请求随机打到另一个后端，表现是「登录成功、所有接口 401」（JWT 密钥不同）。
    # 生产机只有一套，但开发机很容易撞上，所以让名字随项目名变化。
    name: ${COMPOSE_PROJECT_NAME:-note-blog}-internal
    ipam:
      config:
        # edge.conf 的 set_real_ip_from 写死了这个网段，两处必须一致：
        # 改这里就要同步改那里，否则真实客户端 IP 取不到（按 IP 的限流会失准）
        - subnet: ${INTERNAL_SUBNET:-172.28.0.0/24}
