# WebSocket 升级开关已随 /monitor 反代（Beszel）一并移除；
# /api 的 SSE 走 proxy_buffering off 即可，不需要 Upgrade 头。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 图片上传走 /api/assets，后端限制 10MB，这里留一点余量
    client_max_body_size 12m;

    # 301/302 用相对 Location。nginx 默认拿 $host 拼绝对地址，会把 :8088
    # 这类非标准端口丢掉，浏览器跟着跳到 127.0.0.1:80 直接连接被拒
    absolute_redirect off;

    # 问答是 SSE 流式接口：必须关掉缓冲，否则前端会等到全部结束才看到内容
    location = /api/ask {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # RSS 订阅器惯常探测 /rss.xml、/feed.xml、/atom.xml——
    # 不转发的话会被下面的 SPA fallback 吃掉返回 HTML，订阅器拿到假 200 直接失败。
    # 真源在后端 /api/blog/rss.xml，这里做纯别名。
    location = /rss.xml {
        proxy_pass http://backend:8080/api/blog/rss.xml;
        proxy_set_header Host $host;
    }

    location = /feed.xml {
        proxy_pass http://backend:8080/api/blog/rss.xml;
        proxy_set_header Host $host;
    }

    location = /atom.xml {
        proxy_pass http://backend:8080/api/blog/rss.xml;
        proxy_set_header Host $host;
    }

    # sitemap / robots 同样要带站点绝对地址，由后端生成；
    # 不转发会被下面的 SPA fallback 兜底成 index.html，爬虫拿到假 200
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/blog/sitemap.xml;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://backend:8080/api/blog/robots.txt;
        proxy_set_header Host $host;
        access_log off;
    }

    # 前端是 history 模式路由，刷新子路径要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须每次回源校验。
    # 它决定页面去加载哪个 hash 的 JS：一旦被浏览器缓存住，
    # 就会出现「镜像重建了、页面还是旧的」，只能手动 Cmd+Shift+R 才看到。
    # 只给它加 no-cache（配合 ETag 走 304），带 hash 的 /assets/ 仍然长缓存。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带 hash 的静态资源：文件名里有内容 hash，内容变名字就变，
    # 可以放心缓存一年 + immutable（回访用户不再为 JS/CSS 花一个字节）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
