server:
  port: 8080

assets:
  # 图片根目录；默认指向项目根下的 storage/assets（以 backend 目录为工作目录启动）
  root: ${ASSETS_ROOT:../storage/assets}

site:
  # 博客对外地址，用于 RSS 中的链接；生产环境改为真实域名
  base-url: ${SITE_BASE_URL:http://localhost:5173}
  title: ${SITE_TITLE:一隅}

spring:
  mvc:
    async:
      request-timeout: 180000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    filter:
      # 默认是 async,error,request。SSE 结束时会触发 ASYNC 派发，
      # 此时 SecurityContext 已清空，会被误判为未认证而抛 AuthorizationDenied。
      # 初次请求已完成鉴权，因此不让安全链参与异步派发。
      dispatcher-types: request,error
  application:
    name: notes-blog
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:notes_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:notes}
    password: ${DB_PASSWORD:notes_dev_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # 表结构由 db/schema.sql 显式管理，应用不建表也不改表
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 标签集合是 @ManyToMany(fetch = LAZY)，列表接口一页 40 条就是 40 次独立查询
        # （实测 40 条/页 = 42 条 SQL，100 条/页 = 102 条）。开批量抓取后压到 3~4 条。
        # 只在 yml 里写：用 SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE
        # 注入会被宽松绑定转成 hibernate.default.batch.fetch.size，属性绑不上。
        default_batch_fetch_size: 50
  jackson:
    default-property-inclusion: non_null

# 本地能力（M1 向量、M4 问答）
# 三项都用环境变量注入，容器里指向 ollama 服务即可，不必改这份文件
notes:
  embedding:
    # backend=ollama（默认）：base-url 指向 Ollama，api-key 留空
    # backend=openai：base-url 指向 OpenAI 兼容服务（如 https://api.siliconflow.cn/v1），
    #   model 写完整 id（如 BAAI/bge-m3），api-key 必填；
    #   模型必须与建库时一致（bge-m3，1024 维），否则检索全废
    backend: ${EMBEDDING_BACKEND:ollama}
    base-url: ${EMBEDDING_BASE_URL:http://localhost:11434}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:bge-m3}
  llm:
    base-url: ${LLM_BASE_URL:https://opencode.ai/zen/go/v1}
    model: ${LLM_MODEL:minimax-m3}
    api-key: ${LLM_API_KEY:}
    user-agent: notes-blog/0.1

security:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:change-me-now}

app:
  cors:
    # 允许携带这些 Origin 的请求。浏览器即使同源发 POST 也会带 Origin 头，
    # 不在名单里会被 CORS 过滤器直接 403（"Invalid CORS request"）。
    #
    # 默认只放开回环地址的任何端口（开发 5173、预览 4173、容器 8088 都够用）。
    #
    # **刻意不用 IP 通配**：Spring 会把 `192.168.*` 展开成正则 `.*`，
    # 于是 `http://192.168.evil.example` 也能匹配上——这是测试当场抓到的。
    # 要让手机通过局域网 IP 访问，就把具体地址写进 .env 的 CORS_ALLOWED_ORIGINS
    # （compose 会传进容器），形如：
    #   CORS_ALLOWED_ORIGINS=http://localhost:[*],http://127.0.0.1:[*],http://192.168.1.7:8088
    # 上线换真实域名时同理，务必把域名写进去。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

  backup:
    # 备份目录，只读挂载进容器（见 docker-compose.yml）。
    # 后端只读文件时间与大小来判断「多久没备份成功」，不写这个目录。
    dir: ${BACKUP_DIR:/data/backups}

  rate-limit:
    # 这两个接口是"贵"的：问答花 LLM token，搜索做向量检索。
    # 按客户端 IP 每分钟计数，超了返回 429 + Retry-After。
    #
    # ask-per-minute 必须 >= app.guest.ask-ip-daily-ceiling，否则游客会先撞上
    # 「请 60 秒后再试」而不是「今天的次数用完了」——语义不对，体验也莫名其妙。
    # 端到端实测过：设成 10 而日上限 15 时，游客第 11 次就被分钟限流拦。
    ask-per-minute: ${RATE_LIMIT_ASK:25}
    search-per-minute: ${RATE_LIMIT_SEARCH:60}
    # 阅读量计数：正常读者一篇文章在一个会话里只上报一次，30/分钟足够；
    # 不限流的话一个 curl 循环就能把自己刷成「热门第一」。
    view-per-minute: ${RATE_LIMIT_VIEW:30}

  guest:
    # 游客每日问答条数：对单个浏览器的承诺值，前端据此显示「还可提问 N 次」。
    ask-daily-allowance: ${GUEST_ASK_DAILY_ALLOWANCE:5}
    # 游客每日问答条数的服务端硬上限（按 IP），落库、重启不清零。
    # 刻意大于上面的承诺值：手机流量与不少宽带是共享出口 IP，
    # 严格按承诺值会让别人问不了。前端已经把单浏览器压到承诺值了。
    ask-ip-daily-ceiling: ${GUEST_ASK_IP_DAILY_CEILING:15}

logging:
  level:
    com.notesblog: INFO
